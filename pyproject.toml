[project]
name = "subnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.4",
    "async-substrate-interface>=1.6.2",
    "bittensor==10.3.0",
    "click>=8.3.2",
    "docker>=7.1.0",
    "numpy>=1",
    "pydantic>=2",
    "prompt-toolkit>=3.0.0",
    "pytest>=8",
    "python-dotenv>=1.2.2",
    "rich>=13",
    "setuptools>=68",
    "sqlalchemy>=2.0.0",
    "starlette>=0.30.0",
    "substrate-interface>=1.8.1",
    "tenacity>=9.1.4",
]
[tool.setuptools.packages.find]
include = ["tensorusd*", "neurons*"]
exclude = ["verify*", "contrib*"]

[tool.uv]
# bittensor>=10.3.0 depends on `cyscale`, which installs its own `scalecodec`
# module (same import path as py-scale-codec). `substrate-interface` still
# depends on the real `scalecodec` package by name, and having both installed
# corrupts/conflicts (async_substrate_interface refuses to import if it sees
# both). cyscale is a compatible drop-in for scalecodec, so we tell uv to
# never actually install the real one and let cyscale provide the module.
override-dependencies = ["scalecodec; sys_platform == 'never'"]
